name: training-manager

# Elke container krijgt alleen de secrets die hij zelf gebruikt. Eén gedeelde
# `env_file` was makkelijker, maar gaf `web` en `caddy` ook de Supabase
# service-role key — de sleutel die alle RLS omzeilt — terwijl `web` juist het
# enige onderdeel is dat aan het internet hangt. Compose leest `.env.production`
# nog steeds voor de substituties hieronder; wat in de container belandt staat
# per service uitgeschreven.

services:
  web:
    build:
      # De repo-root, niet ./web. `web/lib/training-load.ts` importeert
      # `../../tm_sync/training_load_model.json` — één model, gedeeld met de
      # Python-kant. Met ./web als context bestaat dat pad niet in de container
      # en faalt de build, terwijl hij op je laptop wel lukt. Wat de web-build
      # níét mag zien staat in web/Dockerfile.dockerignore.
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
    environment:
      # Publieke waarden; ook nodig bij server-side rendering, niet alleen in de
      # browserbundle.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      # De coachchat draait als server action in deze container.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    restart: unless-stopped
    ports:
      # Op loopback, niet op 0.0.0.0: de app hoort niet rechtstreeks aan het
      # internet te hangen. De reverse proxy op de host termineert TLS en
      # stuurt hierheen. Zonder deze regel had de container alleen `expose` en
      # was hij vanaf de host onbereikbaar — dan blijft een oude instantie
      # ongemerkt al het verkeer afhandelen terwijl je denkt te hebben
      # gedeployed.
      - "127.0.0.1:${WEB_HOST_PORT:-3002}:3000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - app

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FIT_BUCKET: ${FIT_BUCKET:-garmin-fit}
      GARMIN_THROTTLE_S: ${GARMIN_THROTTLE_S:-0.7}
      GARMIN_TOKENSTORE: /tokens
      TM_WORKER_HEARTBEAT: /tmp/tm_worker.heartbeat
      # De code rekent zelf met deze zone; TZ zet alleen de logtijden gelijk
      # zodat containerlogs en database dezelfde klok tonen.
      TM_TIMEZONE: ${TM_TIMEZONE:-Europe/Brussels}
      TZ: ${TM_TIMEZONE:-Europe/Brussels}
    volumes:
      - ${GARMIN_TOKENSTORE_HOST:-./secrets/garminconnect}:/tokens
    restart: unless-stopped
    init: true
    healthcheck:
      # Een worker die vastloopt zonder te crashen blijft anders "up" heten.
      # De lus schrijft elke poll een hartslag; deze controle kijkt of die
      # recent genoeg is.
      test: ["CMD", "/app/.venv/bin/python", "-m", "tm_worker.health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - app

  # Caddy start alleen met `--profile caddy`. Op een server die al een reverse
  # proxy heeft, kan hij 80 en 443 niet krijgen en zou hij bij elke `up` blijven
  # herstarten. Draai je op een kale VPS zonder nginx, dan is dit wél de weg:
  #   docker compose --env-file .env.production --profile caddy up -d
  caddy:
    profiles:
      - caddy
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config:
